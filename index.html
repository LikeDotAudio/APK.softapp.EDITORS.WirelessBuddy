<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireless RF Spectrum Buddy</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="css/theme.css">
  <!-- THE ONE TABLE (FrontEnd/shared/apk-table.*, vendored; check.sh webshared) -->
  <link rel="stylesheet" href="./vendor/apk-table/apk-table.css">
  <style>
    .main-layout {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 70px);
      padding: 16px;
      gap: 16px;
      box-sizing: border-box;
    }
    .panel {
      background: var(--surface-primary, #18181b);
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      background: var(--surface-secondary, #0f0f11);
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      font-weight: 600;
      font-size: 13px;
      color: var(--text-bright, #f4f4f5);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .svg-viewport {
      background: var(--surface-bg, #121212);
      padding: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .table-container {
      flex: 1;
      overflow-y: auto;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    table.data-table th {
      background: var(--surface-secondary, #0f0f11);
      color: var(--text-muted, #888888);
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      font-size: 11px;
      text-transform: uppercase;
    }
    table.data-table td {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      color: var(--text-bright, #f4f4f5);
    }
    .inline-cell {
      background: rgba(255, 255, 255, 0.02);
      cursor: text;
    }
    .inline-cell:focus {
      outline: 1px solid var(--accent-orange, #F4902C);
      background: rgba(244, 144, 44, 0.1);
    }
    .btn-delete {
      background: transparent;
      border: none;
      color: #FF5A5A;
      cursor: pointer;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .btn-delete:hover {
      background: rgba(255, 90, 90, 0.2);
    }
    .apk-table-host { flex: 1; min-height: 0; display: flex; }
    .net-panel { flex: 0 0 auto; max-height: 32vh; }
    body.net-hidden .net-panel { display: none; }
    #net-status { font-size: 11px; font-weight: normal; }
    #net-status[data-apk-state="good"], .apk-live[data-apk-state="good"] { color: var(--apk-state-good, #4ADE80); }
    #net-status[data-apk-state="kinda"], .apk-live[data-apk-state="kinda"] { color: var(--apk-state-kinda, #F4902C); }
    #net-status[data-apk-state="dead"], .apk-live[data-apk-state="dead"] { color: var(--apk-state-dead, #EF4444); }
    .rf-conflict { color: #EF4444; font-weight: bold; }
    .rf-clear { color: #4ADE80; font-weight: bold; }
  </style>
</head>
<body class="deep-horizon">
  <div class="window-header">
    <div class="window-title">
      <span class="window-icon">📡</span>
      <span class="window-text">Wireless RF Spectrum Buddy</span>
      <span id="block-tag" class="block-tag">RF BLOCK</span>
    </div>
    <div class="window-actions">
      <input type="text" id="prop-planName" placeholder="RF Plan Name" style="background: var(--surface-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 4px 8px; color: var(--text-bright); font-size: 12px; width: 180px;">
      <button id="btn-open" class="btn-action">📂 Open Block</button>
      <button id="btn-discovered" class="btn-action" title="Show / hide what the bus already knows">⚡ Discovered</button>
      <button id="btn-save" class="btn-action btn-primary">💾 Save & Return</button>
      <button id="btn-close" class="btn-action btn-close">✕</button>
    </div>
  </div>

  <div class="main-layout">
    <!-- What the bus already knows (APKSoftapp.discovered; which things: config/discovery.json) -->
    <div class="panel net-panel" id="net-panel">
      <div class="panel-header">
        <span>Radios on the network (live from the bus, not part of the plan)</span>
        <span id="net-status" data-apk-state="kinda">Starting…</span>
      </div>
      <div id="net-table" class="apk-table-host"></div>
    </div>

    <!-- Visual RF Spectrum Viewport -->
    <div class="panel" style="flex: 0 0 auto;">
      <div class="panel-header">
        <span>UHF Spectrum & Intermodulation (IMD3) Waterfall</span>
        <span id="telemetry-badge" style="font-size: 12px; font-weight: bold;">Telemetry Active</span>
      </div>
      <div id="spectrum-svg" class="svg-viewport"></div>
    </div>

    <!-- RF Frequency Schedule Table -->
    <div class="panel" style="flex: 1 1 auto;">
      <div class="panel-header">
        <span>Coordinated RF Transmitter Channels</span>
        <button id="btn-add-rf" class="btn-action btn-small">+ Add RF Carrier</button>
      </div>
      <div class="table-container">
        <div id="rf-table" class="apk-table-host"></div>
      </div>
    </div>
  </div>

  <!-- SDK: the contract's browser bundle (window.APKContracts: topic builders, presence rule). -->
  <script src="./vendor/apk-contracts/apk-contracts.global.js"></script>
  <!-- API: the shell's one softapp bus helper (window.APKBus). Absent off the bench: the panel says so. -->
  <script src="/FrontEnd/shared/apk-bus.js"></script>
  <!-- The one softapp client: CAD host@1 bridge, discovered things, esc (window.APKSoftapp). -->
  <script src="./vendor/apk-softapp/apk-softapp.js"></script>
  <script src="./vendor/apk-table/apk-table.js"></script>
  <script type="module" src="js/wirelessApp.js"></script>
</body>
</html>
