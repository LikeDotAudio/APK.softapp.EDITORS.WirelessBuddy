<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireless RF Spectrum Buddy</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .main-layout {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 70px);
      padding: 16px;
      gap: 16px;
      box-sizing: border-box;
    }
    .panel {
      background: var(--surface-primary, #18181b);
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      background: var(--surface-secondary, #0f0f11);
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      font-weight: 600;
      font-size: 13px;
      color: var(--text-bright, #f4f4f5);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .svg-viewport {
      background: var(--surface-bg, #121212);
      padding: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .table-container {
      flex: 1;
      overflow-y: auto;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    table.data-table th {
      background: var(--surface-secondary, #0f0f11);
      color: var(--text-muted, #888888);
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      font-size: 11px;
      text-transform: uppercase;
    }
    table.data-table td {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      color: var(--text-bright, #f4f4f5);
    }
    .inline-cell {
      background: rgba(255, 255, 255, 0.02);
      cursor: text;
    }
    .inline-cell:focus {
      outline: 1px solid var(--accent-orange, #F4902C);
      background: rgba(244, 144, 44, 0.1);
    }
    .btn-delete {
      background: transparent;
      border: none;
      color: #FF5A5A;
      cursor: pointer;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .btn-delete:hover {
      background: rgba(255, 90, 90, 0.2);
    }
  </style>
</head>
<body class="deep-horizon">
  <div class="window-header">
    <div class="window-title">
      <span class="window-icon">📡</span>
      <span class="window-text">Wireless RF Spectrum Buddy</span>
      <span id="block-tag" class="block-tag">RF BLOCK</span>
    </div>
    <div class="window-actions">
      <input type="text" id="prop-planName" placeholder="RF Plan Name" style="background: var(--surface-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 4px 8px; color: var(--text-bright); font-size: 12px; width: 180px;">
      <button id="btn-open" class="btn-action">📂 Open Block</button>
      <button id="btn-discovered" class="btn-action">⚡ Discovered</button>
      <button id="btn-save" class="btn-action btn-primary">💾 Save & Return</button>
      <button id="btn-close" class="btn-action btn-close">✕</button>
    </div>
  </div>

  <div class="main-layout">
    <!-- Visual RF Spectrum Viewport -->
    <div class="panel" style="flex: 0 0 auto;">
      <div class="panel-header">
        <span>UHF Spectrum & Intermodulation (IMD3) Waterfall</span>
        <span id="telemetry-badge" style="font-size: 12px; font-weight: bold;">Telemetry Active</span>
      </div>
      <div id="spectrum-svg" class="svg-viewport"></div>
    </div>

    <!-- RF Frequency Schedule Table -->
    <div class="panel" style="flex: 1 1 auto;">
      <div class="panel-header">
        <span>Coordinated RF Transmitter Channels</span>
        <button id="btn-add-rf" class="btn-action btn-small">+ Add RF Carrier</button>
      </div>
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width: 5%;">ID</th>
              <th style="width: 25%;">Transmitter / Performer</th>
              <th style="width: 15%;">Frequency (MHz)</th>
              <th style="width: 10%;">Power (mW)</th>
              <th style="width: 8%;">Group</th>
              <th style="width: 8%;">Channel</th>
              <th style="width: 15%;">Antenna Zone</th>
              <th style="width: 10%;">IMD Clearance</th>
              <th style="width: 4%; text-align: center;">Act</th>
            </tr>
          </thead>
          <tbody id="rf-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="js/wirelessApp.js"></script>
</body>
</html>
