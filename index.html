<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireless RF Spectrum Buddy — APK.audio</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f1218; color: #e2e8f0; margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #283348; padding-bottom: 12px; margin-bottom: 20px; }
    .card { background: #171d27; border: 1px solid #283348; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #222c3d; font-family: monospace; }
    button { background: #0284c7; color: #fff; border: 1px solid #38bdf8; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="font-size:20px;">📡</span>
      <h2>Wireless RF Spectrum Buddy</h2>
    </div>
    <button id="btn-export">Export Frequency Chart</button>
  </header>

  <div class="card">
    <h3 style="font-size:14px; text-transform:uppercase; color:#94a3b8;">Coordinated Transmitters (UHF TV Band 470-608 MHz)</h3>
    <table>
      <thead><tr><th>Channel</th><th>Carrier Freq</th><th>Tx Power</th><th>IMD Status</th></tr></thead>
      <tbody id="rf-rows"></tbody>
    </table>
  </div>

  <script type="module">
    import { WirelessSpectrumModel } from './js/wirelessApp.js';
    const model = new WirelessSpectrumModel();
    const tbody = document.getElementById('rf-rows');

    model.channels.forEach(c => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><b>${c.name}</b></td><td style="color:#38bdf8;">${c.freqMHz.toFixed(3)} MHz</td><td>${c.powerMw} mW</td><td style="color:#34d399;">● ${c.status}</td>`;
      tbody.appendChild(tr);
    });

    document.getElementById('btn-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(model.channels, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'wireless-coordination.json';
      a.click();
    });
  </script>
</body>
</html>
